<!DOCTYPE html>
<html lang="ja" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>地上天気図 × ひまわり衛星 v2.7 (2026-09-24)</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+JP:wght@400;500;700&display=swap');
    body {
      font-family: 'Noto Sans JP', sans-serif;
      touch-action: manipulation;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    #map {
      height: 100%;
      width: 100%;
      background-color: #111827;
    }
    .blend-multiply {
      mix-blend-mode: multiply !important;
      filter: contrast(140%) brightness(95%);
    }
    .blend-normal {
      mix-blend-mode: normal !important;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 18px;
      width: 18px;
      border-radius: 50%;
      background: #38bdf8;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
    }
  </style>
</head>
<body class="h-full w-full overflow-hidden flex flex-col select-none">

  <!-- ヘッダー -->
  <header class="h-12 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 flex items-center justify-between px-3 z-20 shrink-0">
    <div class="flex items-center space-x-2">
      <i data-lucide="layers" class="w-5 h-5 text-sky-400"></i>
      <div class="flex items-baseline gap-1.5">
        <h1 class="text-sm font-bold tracking-wider text-slate-100">
          天気図 <span class="text-sky-400 text-xs font-normal">× ひまわり</span>
        </h1>
        <span class="text-[10px] font-mono text-slate-400 bg-slate-800 px-1.5 py-0.5 rounded border border-slate-700">v2.7</span>
      </div>
    </div>
    
    <div class="flex items-center space-x-2 text-xs">
      <span id="chart-time" class="font-mono text-slate-400 bg-slate-800/80 px-2 py-0.5 rounded border border-slate-700/60">
        実況取得中...
      </span>
      <button onclick="loadAllData()" class="p-1.5 bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-300 rounded transition border border-slate-700" title="最新データ再取得">
        <i data-lucide="rotate-cw" class="w-4 h-4"></i>
      </button>
    </div>
  </header>

  <!-- 地図領域 -->
  <main class="relative flex-1 w-full h-full overflow-hidden">
    <div id="map"></div>

    <!-- パネル展開用フローティングボタン（最小化時に表示） -->
    <button id="btn-panel-open" onclick="togglePanel(true)" 
            class="hidden absolute bottom-5 right-4 w-12 h-12 bg-slate-900/80 text-sky-400 border border-slate-700/80 rounded-full shadow-2xl z-[1000] flex items-center justify-center active:scale-95 transition backdrop-blur-sm">
      <i data-lucide="sliders" class="w-6 h-6"></i>
    </button>

    <!-- コントロールパネル本体（高透過・コンパクト設計） -->
    <div id="control-panel" class="absolute bottom-4 left-3 right-3 sm:left-auto sm:right-4 sm:w-84 bg-slate-950/40 border border-slate-600/50 rounded-xl p-2.5 z-[1000] shadow-2xl flex flex-col gap-2 max-h-[80vh] overflow-y-auto transition-colors duration-200">
      
      <!-- パネルヘッダー -->
      <div class="flex items-center justify-between border-b border-slate-700/40 pb-1">
        <span class="text-xs font-semibold text-slate-200 flex items-center gap-1.5 drop-shadow">
          <i data-lucide="move" class="w-3.5 h-3.5 text-sky-400"></i>
          位置・縮尺補正
        </span>
        <div class="flex items-center gap-1">
          <!-- 透過度切り替えボタン -->
          <button onclick="cyclePanelOpacity()" class="p-1 text-sky-400 hover:text-sky-300 active:scale-90 transition rounded bg-slate-900/60 border border-slate-700/60" title="パネルの透け具合を切替">
            <i data-lucide="eye" class="w-3.5 h-3.5"></i>
          </button>
          <!-- 最小化ボタン -->
          <button onclick="togglePanel(false)" class="p-1 text-slate-300 hover:text-slate-100 active:scale-90 transition rounded bg-slate-900/60 border border-slate-700/60" title="パネルを最小化">
            <i data-lucide="chevron-down" class="w-3.5 h-3.5"></i>
          </button>
        </div>
      </div>

      <!-- 位置 ＆ 縮尺微調整（常時表示メイン領域） -->
      <div class="space-y-1.5">
        <!-- 縮尺調整 -->
        <div class="bg-slate-900/40 p-1.5 rounded border border-slate-700/40">
          <div class="flex justify-between text-[11px] mb-0.5">
            <span class="text-slate-300 drop-shadow">縮尺</span>
            <span id="val-scale" class="font-mono text-sky-300 drop-shadow">100%</span>
          </div>
          <div class="flex items-center gap-1.5">
            <button onclick="stepAdjust('slider-scale', -1)" class="w-8 h-7 bg-slate-800/80 active:bg-slate-700 text-slate-100 rounded border border-slate-600/60 text-sm font-bold flex items-center justify-center shrink-0">－</button>
            <input id="slider-scale" type="range" min="50" max="200" value="100" class="flex-1 h-2 bg-slate-700/70 rounded appearance-none cursor-pointer">
            <button onclick="stepAdjust('slider-scale', 1)" class="w-8 h-7 bg-slate-800/80 active:bg-slate-700 text-slate-100 rounded border border-slate-600/60 text-sm font-bold flex items-center justify-center shrink-0">＋</button>
          </div>
        </div>

        <!-- 東西シフト -->
        <div class="bg-slate-900/40 p-1.5 rounded border border-slate-700/40">
          <div class="flex justify-between text-[11px] mb-0.5">
            <span class="text-slate-300 drop-shadow">東西 (左右)</span>
            <span id="val-offset-x" class="font-mono text-sky-300 drop-shadow">0</span>
          </div>
          <div class="flex items-center gap-1.5">
            <button onclick="stepAdjust('slider-offset-x', -1)" class="w-8 h-7 bg-slate-800/80 active:bg-slate-700 text-slate-100 rounded border border-slate-600/60 text-sm font-bold flex items-center justify-center shrink-0">◀</button>
            <input id="slider-offset-x" type="range" min="-300" max="300" value="0" class="flex-1 h-2 bg-slate-700/70 rounded appearance-none cursor-pointer">
            <button onclick="stepAdjust('slider-offset-x', 1)" class="w-8 h-7 bg-slate-800/80 active:bg-slate-700 text-slate-100 rounded border border-slate-600/60 text-sm font-bold flex items-center justify-center shrink-0">▶</button>
          </div>
        </div>

        <!-- 南北シフト -->
        <div class="bg-slate-900/40 p-1.5 rounded border border-slate-700/40">
          <div class="flex justify-between text-[11px] mb-0.5">
            <span class="text-slate-300 drop-shadow">南北 (上下)</span>
            <span id="val-offset-y" class="font-mono text-sky-300 drop-shadow">0</span>
          </div>
          <div class="flex items-center gap-1.5">
            <button onclick="stepAdjust('slider-offset-y', -1)" class="w-8 h-7 bg-slate-800/80 active:bg-slate-700 text-slate-100 rounded border border-slate-600/60 text-sm font-bold flex items-center justify-center shrink-0">▼</button>
            <input id="slider-offset-y" type="range" min="-300" max="300" value="0" class="flex-1 h-2 bg-slate-700/70 rounded appearance-none cursor-pointer">
            <button onclick="stepAdjust('slider-offset-y', 1)" class="w-8 h-7 bg-slate-800/80 active:bg-slate-700 text-slate-100 rounded border border-slate-600/60 text-sm font-bold flex items-center justify-center shrink-0">▲</button>
          </div>
        </div>

        <div class="flex gap-2 pt-0.5">
          <button onclick="resetAdjustment()" class="flex-1 py-1.5 bg-slate-800/70 hover:bg-slate-700/80 active:bg-slate-600 text-xs text-slate-300 rounded border border-slate-700/60 transition">
            初期値リセット
          </button>
          <button id="btn-rectify-toggle" onclick="toggleRectify()" class="px-3 py-1.5 rounded text-xs font-medium bg-slate-800/70 border border-slate-700/60 text-sky-400">
            <span id="rectify-status-text">補正: ON</span>
          </button>
        </div>
      </div>

      <!-- その他設定（アコーディオンで通常時は収納） -->
      <details class="border-t border-slate-700/40 pt-1 text-xs text-slate-400 group">
        <summary class="cursor-pointer flex items-center justify-between py-1 select-none text-[11px] text-slate-400 hover:text-slate-200">
          <span>画像・合成詳細設定</span>
          <span class="text-[9px] group-open:rotate-180 transition">▼</span>
        </summary>
        <div class="mt-2 space-y-2 bg-slate-900/40 p-2 rounded border border-slate-800/60">
          <div>
            <label class="text-[10px] text-slate-400 block mb-1">対象領域</label>
            <div class="flex bg-slate-800/80 rounded p-0.5 border border-slate-700/60">
              <button id="btn-area-near" onclick="switchArea('near')" class="flex-1 py-1 rounded text-center text-xs font-medium bg-sky-500 text-slate-950">日本周辺</button>
              <button id="btn-area-asia" onclick="switchArea('asia')" class="flex-1 py-1 rounded text-center text-xs font-medium text-slate-400">アジア広域</button>
            </div>
          </div>
          <div>
            <div class="flex justify-between text-[11px] mb-1">
              <span>天気図の不透明度</span>
              <span id="opacity-val" class="font-mono text-sky-400">75%</span>
            </div>
            <input id="opacity-slider" type="range" min="0" max="100" value="75" class="w-full h-1.5 bg-slate-700/70 rounded cursor-pointer accent-sky-400">
          </div>
          <div class="grid grid-cols-2 gap-1.5">
            <div>
              <label class="text-[10px] text-slate-400 block mb-1">合成方式</label>
              <div class="flex bg-slate-800/80 rounded p-0.5 border border-slate-700/60">
                <button id="btn-multiply" onclick="setBlendMode('multiply')" class="flex-1 py-1 rounded text-[11px] bg-sky-500 text-slate-950 font-medium">乗算</button>
                <button id="btn-normal" onclick="setBlendMode('normal')" class="flex-1 py-1 rounded text-[11px] text-slate-400 font-medium">通常</button>
              </div>
            </div>
            <div>
              <label class="text-[10px] text-slate-400 block mb-1">衛星画像</label>
              <div class="flex bg-slate-800/80 rounded p-0.5 border border-slate-700/60">
                <button id="btn-sat-color" onclick="switchSatelliteBand('color')" class="flex-1 py-1 rounded text-[11px] bg-sky-500 text-slate-950 font-medium">カラー</button>
                <button id="btn-sat-ir" onclick="switchSatelliteBand('ir')" class="flex-1 py-1 rounded text-[11px] text-slate-400 font-medium">赤外</button>
              </div>
            </div>
          </div>
          <div class="pt-1">
            <button onclick="resetMapView()" class="w-full py-1 bg-slate-800/80 hover:bg-slate-700 text-slate-300 rounded border border-slate-700/60 text-[11px]">
              視点リセット
            </button>
          </div>
        </div>
      </details>

    </div>
  </main>

  <script>
    let map;
    let weatherOverlay = null;
    let himawariLayer = null;
    let currentArea = 'near';       // 'near' or 'asia'
    let currentSatBand = 'color';   // 'color' or 'ir'
    let isSatelliteVisible = true;
    let currentBlendMode = 'multiply';
    let currentOpacity = 0.75;
    let isRectifyEnabled = true;
    let cachedJmaData = null;
    let rawWeatherImg = null;

    // 手動補正パラメータ
    let userScale = 1.0;
    let userOffsetX = 0;
    let userOffsetY = 0;

    // パネル透過状態フラグ
    let isGhostMode = false;

    // 基本領域定義
    const BASE_BOUNDS = {
      near: { latMin: 20.0, latMax: 50.0, lonMin: 118.0, lonMax: 154.0 },
      asia: { latMin: 0.0,  latMax: 65.0, lonMin: 80.0,  lonMax: 175.0 }
    };

    // 日本付近（北緯35度・東経140度）をアンカー基準とする幾何パラメータ
    const PROJ_PARAMS = {
      near: {
        uCenter: 0.50,    // 日本（35N, 140E）の画像横位置比率
        vCenter: 0.38,    // 日本（35N, 140E）の画像縦位置比率 (srcW基準)
        scale: 1.00       // 基準ピクセルスケール
      },
      asia: {
        uCenter: 0.56,    // 凡例枠を考慮した東経140度線の横位置比率
        vCenter: 0.40,    // 北緯35度の縦位置比率 (srcW基準)
        scale: 0.48       // 基準ピクセルスケール
      }
    };

    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      initMap();
      loadAllData();
      setupSliders();
    });

    function initMap() {
      map = L.map('map', {
        zoomControl: false,
        attributionControl: false,
        minZoom: 2,
        maxZoom: 8
      }).setView([36.0, 137.5], 5);

      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 16
      }).addTo(map);

      L.control.zoom({ position: 'topleft' }).addTo(map);
    }

    async function loadAllData() {
      document.getElementById('chart-time').textContent = '更新中...';
      await Promise.all([updateSatelliteLayer(), fetchWeatherChartList()]);
      processWeatherChart();
    }

    // 衛星画像更新
    async function updateSatelliteLayer() {
      const mode = currentArea === 'near' ? 'jp' : 'fd';
      const targetTimeUrl = `https://www.jma.go.jp/bosai/himawari/data/satimg/targetTimes_${mode}.json`;

      try {
        const res = await fetch(targetTimeUrl);
        const times = await res.json();
        if (times && times.length > 0) {
          const latest = times[times.length - 1];
          const basetime = latest.basetime;
          const validtime = latest.validtime;

          if (himawariLayer) {
            map.removeLayer(himawariLayer);
          }

          const bandPath = currentSatBand === 'color' ? 'REP/ETC' : 'B13/TBB';

          himawariLayer = L.tileLayer(
            `https://www.jma.go.jp/bosai/himawari/data/satimg/${basetime}/${mode}/${validtime}/${bandPath}/{z}/{x}/{y}.jpg`,
            {
              opacity: 0.85,
              zIndex: 10,
              maxNativeZoom: mode === 'near' ? 6 : 5,
              maxZoom: 8
            }
          );

          if (isSatelliteVisible) {
            himawariLayer.addTo(map);
          }
        }
      } catch (err) {
        console.warn('衛星データ取得失敗:', err);
      }
    }

    async function switchSatelliteBand(band) {
      if (currentSatBand === band) return;
      currentSatBand = band;

      const btnColor = document.getElementById('btn-sat-color');
      const btnIr = document.getElementById('btn-sat-ir');

      if (band === 'color') {
        btnColor.className = 'flex-1 py-1 rounded text-[11px] bg-sky-500 text-slate-950 font-medium';
        btnIr.className = 'flex-1 py-1 rounded text-[11px] text-slate-400 font-medium';
      } else {
        btnIr.className = 'flex-1 py-1 rounded text-[11px] bg-sky-500 text-slate-950 font-medium';
        btnColor.className = 'flex-1 py-1 rounded text-[11px] text-slate-400 font-medium';
      }

      await updateSatelliteLayer();
    }

    async function fetchWeatherChartList() {
      try {
        const jmaRes = await fetch('https://www.jma.go.jp/bosai/weather_map/data/list.json');
        cachedJmaData = await jmaRes.json();
      } catch (err) {
        console.error('天気図リスト取得失敗:', err);
      }
    }

    function processWeatherChart() {
      if (!cachedJmaData) return;
      const areaGroup = cachedJmaData[currentArea];

      if (areaGroup && areaGroup.now && areaGroup.now.length > 0) {
        const fileName = areaGroup.now[areaGroup.now.length - 1];
        const imageUrl = `https://www.jma.go.jp/bosai/weather_map/data/png/${fileName}`;
        
        try {
          const match = fileName.match(/(\d{4})(\d{2})(\d{2})(\d{2})\d{4}/);
          if (match) {
            const m = match[2];
            const d = match[3];
            const utcHour = parseInt(match[4], 10);
            const jstHour = (utcHour + 9) % 24;
            const reg = currentArea === 'near' ? '日本' : 'アジア';
            document.getElementById('chart-time').textContent = `${reg} ${m}/${d} ${String(jstHour).padStart(2, '0')}:00`;
          }
        } catch(e) {
          document.getElementById('chart-time').textContent = '最新実況';
        }

        const img = new Image();
        img.crossOrigin = "anonymous";
        img.onload = () => {
          rawWeatherImg = img;
          renderLayer();
        };
        img.onerror = () => {
          fallbackRender(imageUrl);
        };
        img.src = imageUrl;
      }
    }

    // 高解像度Canvas幾何補正エンジン (日本中心アンカー基準)
    function renderLayer() {
      if (!rawWeatherImg) return;

      const base = BASE_BOUNDS[currentArea];
      
      const bounds = [
        [base.latMin, base.lonMin],
        [base.latMax, base.lonMax]
      ];

      if (!isRectifyEnabled) {
        fallbackRender(rawWeatherImg.src, bounds);
        return;
      }

      const canvas = document.createElement('canvas');
      const dstW = 1920;
      const spanLat = base.latMax - base.latMin;
      const spanLon = base.lonMax - base.lonMin;
      const dstH = Math.round(dstW * (spanLat / spanLon) * 1.25);
      canvas.width = dstW;
      canvas.height = dstH;

      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';

      const srcCanvas = document.createElement('canvas');
      srcCanvas.width = rawWeatherImg.width;
      srcCanvas.height = rawWeatherImg.height;
      const srcCtx = srcCanvas.getContext('2d');
      srcCtx.drawImage(rawWeatherImg, 0, 0);

      let srcPixels, dstPixels, dstData;
      try {
        const srcData = srcCtx.getImageData(0, 0, srcCanvas.width, srcCanvas.height);
        srcPixels = new Uint32Array(srcData.data.buffer);
        dstData = ctx.createImageData(dstW, dstH);
        dstPixels = new Uint32Array(dstData.data.buffer);
      } catch (e) {
        fallbackRender(rawWeatherImg.src, bounds);
        return;
      }

      const srcW = srcCanvas.width;
      const srcH = srcCanvas.height;
      const params = PROJ_PARAMS[currentArea];

      const phi0 = 60 * Math.PI / 180;
      const lam0 = 140 * Math.PI / 180;

      // 日本付近（北緯35度・東経140度）の基準動径（アンカー点）
      const phiC = 35 * Math.PI / 180;
      const rCenter = ((1 + Math.sin(phi0)) / (1 + Math.sin(phiC))) * Math.cos(phiC);

      // 共通スケール
      const K = srcW * params.scale;

      const latMin = bounds[0][0];
      const latMax = bounds[1][0];
      const lonMin = bounds[0][1];
      const lonMax = bounds[1][1];

      const qMin = Math.log(Math.tan(Math.PI / 4 + (latMin * Math.PI / 180) / 2));
      const qMax = Math.log(Math.tan(Math.PI / 4 + (latMax * Math.PI / 180) / 2));

      for (let y = 0; y < dstH; y++) {
        const q = qMax - (y / dstH) * (qMax - qMin);
        const phi = 2 * Math.atan(Math.exp(q)) - Math.PI / 2;
        const r = ((1 + Math.sin(phi0)) / (1 + Math.sin(phi))) * Math.cos(phi);

        for (let x = 0; x < dstW; x++) {
          const lonDeg = lonMin + (x / dstW) * (lonMax - lonMin);
          const lam = lonDeg * Math.PI / 180;
          const dLam = lam - lam0;

          const xps = r * Math.sin(dLam);
          const yps = r * Math.cos(dLam);

          // 日本（北緯35度・東経140度）からの相対距離
          const dx = xps;
          const dy = yps - rCenter;

          // 日本を中心に拡大・縮小、直感的なシフト移動
          const u = Math.round(srcW * params.uCenter + (K * dx) / userScale - userOffsetX * srcW);
          const v = Math.round(srcW * params.vCenter + (K * dy) / userScale - userOffsetY * srcW);

          if (u >= 0 && u < srcW && v >= 0 && v < srcH) {
            dstPixels[y * dstW + x] = srcPixels[v * srcW + u];
          } else {
            dstPixels[y * dstW + x] = 0;
          }
        }
      }

      ctx.putImageData(dstData, 0, 0);

      canvas.toBlob((blob) => {
        if (!blob) return;
        const rectUrl = URL.createObjectURL(blob);

        if (weatherOverlay) {
          map.removeLayer(weatherOverlay);
        }

        weatherOverlay = L.imageOverlay(rectUrl, bounds, {
          opacity: currentOpacity,
          zIndex: 20,
          className: currentBlendMode === 'multiply' ? 'blend-multiply' : 'blend-normal'
        }).addTo(map);
      });
    }

    function fallbackRender(url, bounds) {
      if (weatherOverlay) {
        map.removeLayer(weatherOverlay);
      }
      weatherOverlay = L.imageOverlay(url, bounds, {
        opacity: currentOpacity,
        zIndex: 20,
        className: currentBlendMode === 'multiply' ? 'blend-multiply' : 'blend-normal'
      }).addTo(map);
    }

    async function switchArea(area) {
      if (currentArea === area) return;
      currentArea = area;

      const btnNear = document.getElementById('btn-area-near');
      const btnAsia = document.getElementById('btn-area-asia');

      if (area === 'near') {
        btnNear.className = 'flex-1 py-1 rounded text-center text-xs font-medium bg-sky-500 text-slate-950';
        btnAsia.className = 'flex-1 py-1 rounded text-center text-xs font-medium text-slate-400';
        map.flyTo([36.0, 137.5], 5, { duration: 0.8 });
      } else {
        btnAsia.className = 'flex-1 py-1 rounded text-center text-xs font-medium bg-sky-500 text-slate-950';
        btnNear.className = 'flex-1 py-1 rounded text-center text-xs font-medium text-slate-400';
        map.flyTo([32.0, 132.0], 3, { duration: 0.8 });
      }

      resetAdjustment();
      await updateSatelliteLayer();
      processWeatherChart();
    }

    function toggleRectify() {
      isRectifyEnabled = !isRectifyEnabled;
      document.getElementById('rectify-status-text').textContent = isRectifyEnabled ? '補正: ON' : '補正: OFF';
      renderLayer();
    }

    function setupSliders() {
      const sliderOpacity = document.getElementById('opacity-slider');
      sliderOpacity.addEventListener('input', (e) => {
        currentOpacity = e.target.value / 100;
        document.getElementById('opacity-val').textContent = `${e.target.value}%`;
        if (weatherOverlay) {
          weatherOverlay.setOpacity(currentOpacity);
        }
      });

      const sliderScale = document.getElementById('slider-scale');
      sliderScale.addEventListener('input', (e) => {
        userScale = parseInt(e.target.value, 10) / 100;
        document.getElementById('val-scale').textContent = `${e.target.value}%`;
        renderLayer();
      });

      const sliderX = document.getElementById('slider-offset-x');
      sliderX.addEventListener('input', (e) => {
        const val = parseInt(e.target.value, 10);
        userOffsetX = val * 0.001;
        document.getElementById('val-offset-x').textContent = `${val > 0 ? '+' : ''}${val}`;
        renderLayer();
      });

      const sliderY = document.getElementById('slider-offset-y');
      sliderY.addEventListener('input', (e) => {
        const val = parseInt(e.target.value, 10);
        userOffsetY = val * 0.001;
        document.getElementById('val-offset-y').textContent = `${val > 0 ? '+' : ''}${val}`;
        renderLayer();
      });
    }

    function resetAdjustment() {
      userScale = 1.0;
      userOffsetX = 0;
      userOffsetY = 0;
      document.getElementById('slider-scale').value = 100;
      document.getElementById('slider-offset-x').value = 0;
      document.getElementById('slider-offset-y').value = 0;
      document.getElementById('val-scale').textContent = '100%';
      document.getElementById('val-offset-x').textContent = '0';
      document.getElementById('val-offset-y').textContent = '0';
      renderLayer();
    }

    function setBlendMode(mode) {
      currentBlendMode = mode;
      const btnMultiply = document.getElementById('btn-multiply');
      const btnNormal = document.getElementById('btn-normal');

      if (mode === 'multiply') {
        btnMultiply.className = 'flex-1 py-1 rounded text-[11px] bg-sky-500 text-slate-950 font-medium';
        btnNormal.className = 'flex-1 py-1 rounded text-[11px] text-slate-400 font-medium';
      } else {
        btnNormal.className = 'flex-1 py-1 rounded text-[11px] bg-sky-500 text-slate-950 font-medium';
        btnMultiply.className = 'flex-1 py-1 rounded text-[11px] text-slate-400 font-medium';
      }

      if (weatherOverlay) {
        const el = weatherOverlay.getElement();
        if (el) {
          el.className = mode === 'multiply' ? 'leaflet-image-layer blend-multiply' : 'leaflet-image-layer blend-normal';
        }
      }
    }

    function resetMapView() {
      if (currentArea === 'near') {
        map.setView([36.0, 137.5], 5);
      } else {
        map.setView([32.0, 132.0], 3);
      }
    }

    // パネル最小化・展開トグル
    function togglePanel(open) {
      const panel = document.getElementById('control-panel');
      const openBtn = document.getElementById('btn-panel-open');
      if (open) {
        panel.classList.remove('hidden');
        openBtn.classList.add('hidden');
      } else {
        panel.classList.add('hidden');
        openBtn.classList.remove('hidden');
      }
    }

    // パネル透過度切り替え（通常透過 40% ⇔ 超透過 15%）
    function cyclePanelOpacity() {
      const panel = document.getElementById('control-panel');
      isGhostMode = !isGhostMode;
      if (isGhostMode) {
        panel.classList.remove('bg-slate-950/40');
        panel.classList.add('bg-slate-950/15');
      } else {
        panel.classList.remove('bg-slate-950/15');
        panel.classList.add('bg-slate-950/40');
      }
    }

    // ボタンによる1ステップ精密微調整
    function stepAdjust(sliderId, step) {
      const slider = document.getElementById(sliderId);
      if (!slider) return;
      slider.value = parseInt(slider.value, 10) + step;
      slider.dispatchEvent(new Event('input'));
    }
  </script>
</body>
</html>
