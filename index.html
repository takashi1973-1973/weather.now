<!DOCTYPE html>
<html lang="ja" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>地上天気図 × ひまわり衛星 v2.1 (2026-09-24)</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+JP:wght@400;500;700&display=swap');
    body {
      font-family: 'Noto Sans JP', sans-serif;
      touch-action: manipulation;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    #map {
      height: 100%;
      width: 100%;
      background-color: #111827;
    }
    .blend-multiply {
      mix-blend-mode: multiply !important;
      filter: contrast(135%) brightness(95%);
    }
    .blend-normal {
      mix-blend-mode: normal !important;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 18px;
      width: 18px;
      border-radius: 50%;
      background: #38bdf8;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
    }
  </style>
</head>
<body class="h-full w-full overflow-hidden flex flex-col select-none">

  <!-- ヘッダー -->
  <header class="h-12 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 flex items-center justify-between px-3 z-20 shrink-0">
    <div class="flex items-center space-x-2">
      <i data-lucide="layers" class="w-5 h-5 text-sky-400"></i>
      <div class="flex items-baseline gap-1.5">
        <h1 class="text-sm font-bold tracking-wider text-slate-100">
          天気図 <span class="text-sky-400 text-xs font-normal">× ひまわり</span>
        </h1>
        <span class="text-[10px] font-mono text-slate-400 bg-slate-800 px-1.5 py-0.5 rounded border border-slate-700">v2.1 (2026.09.24)</span>
      </div>
    </div>
    
    <div class="flex items-center space-x-2 text-xs">
      <span id="chart-time" class="font-mono text-slate-400 bg-slate-800/80 px-2 py-0.5 rounded border border-slate-700/60">
        実況取得中...
      </span>
      <button onclick="loadAllData()" class="p-1.5 bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-300 rounded transition border border-slate-700" title="最新データ再取得">
        <i data-lucide="rotate-cw" class="w-4 h-4"></i>
      </button>
    </div>
  </header>

  <!-- 地図領域 -->
  <main class="relative flex-1 w-full h-full overflow-hidden">
    <div id="map"></div>

    <!-- コントロールパネル -->
    <div class="absolute bottom-4 left-3 right-3 sm:left-auto sm:right-4 sm:w-84 bg-slate-900/95 backdrop-blur-md border border-slate-700/80 rounded-xl p-3 z-[1000] shadow-2xl flex flex-col gap-2.5">
      
      <!-- 天気図種別切り替え (実況 ⇄ 専門) -->
      <div>
        <label class="text-[11px] text-slate-400 block mb-1">天気図種別</label>
        <div class="flex bg-slate-800 rounded-lg p-0.5 border border-slate-700">
          <button id="btn-mode-live" onclick="setChartTypeMode('live')" class="flex-1 py-1 rounded text-center text-xs font-medium bg-sky-500 text-slate-950 transition">実況天気図</button>
          <button id="btn-mode-expert" onclick="setChartTypeMode('expert')" class="flex-1 py-1 rounded text-center text-xs font-medium text-slate-400 hover:text-slate-200 transition">専門天気図</button>
        </div>
      </div>

      <!-- 専門天気図選択プルダウン -->
      <div id="expert-select-container" class="hidden">
        <label class="text-[11px] text-slate-400 block mb-1">専門天気図の種類</label>
        <select id="expert-chart-select" onchange="onExpertChartChange()" class="w-full bg-slate-800 border border-slate-700 text-xs text-sky-300 rounded-lg p-1.5 focus:outline-none focus:border-sky-500">
          <option value="AXFE578">極東地上・500hPa高度渦度図 (AXFE578)</option>
          <option value="ASAS">アジア太平洋地上実況図 (ASAS)</option>
          <option value="FSAS24">極東地上・降水量24h予想図 (FSAS24)</option>
          <option value="AUPN50">アジア500hPa高度気温図 (AUPN50)</option>
        </select>
      </div>

      <!-- 不透明度スライダー -->
      <div>
        <div class="flex justify-between items-center text-xs font-semibold mb-1">
          <span class="text-slate-300 flex items-center gap-1">
            <i data-lucide="sliders" class="w-3.5 h-3.5 text-sky-400"></i>
            天気図の不透明度
          </span>
          <span id="opacity-val" class="font-mono text-sky-400">85%</span>
        </div>
        <input id="opacity-slider" type="range" min="0" max="100" value="85" 
               class="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-sky-400">
      </div>

      <!-- 合成方式 & 領域切り替え -->
      <div class="grid grid-cols-2 gap-2 text-xs">
        <div>
          <label class="text-[11px] text-slate-400 block mb-1">合成方式</label>
          <div class="flex bg-slate-800 rounded-lg p-0.5 border border-slate-700">
            <button id="btn-multiply" onclick="setBlendMode('multiply')" class="flex-1 py-1 rounded text-center font-medium bg-sky-500 text-slate-950 transition">乗算(白透過)</button>
            <button id="btn-normal" onclick="setBlendMode('normal')" class="flex-1 py-1 rounded text-center font-medium text-slate-400 hover:text-slate-200 transition">通常</button>
          </div>
        </div>

        <div>
          <label class="text-[11px] text-slate-400 block mb-1">対象領域 (衛星連動)</label>
          <div class="flex bg-slate-800 rounded-lg p-0.5 border border-slate-700">
            <button id="btn-area-near" onclick="switchArea('near')" class="flex-1 py-1 rounded text-center font-medium bg-sky-500 text-slate-950 transition">日本周辺</button>
            <button id="btn-area-asia" onclick="switchArea('asia')" class="flex-1 py-1 rounded text-center font-medium text-slate-400 hover:text-slate-200 transition">アジア広域</button>
          </div>
        </div>
      </div>

      <!-- 衛星画像設定：赤外 ⇄ カラー切り替え -->
      <div>
        <div class="flex justify-between items-center mb-1">
          <label class="text-[11px] text-slate-400">ひまわり衛星画像</label>
          <button onclick="toggleSatelliteVisibility()" id="btn-sat-eye" class="text-[10px] text-sky-400 hover:underline">
            表示中 (タップで非表示)
          </button>
        </div>
        <div class="flex bg-slate-800 rounded-lg p-0.5 border border-slate-700 text-xs">
          <button id="btn-sat-ir" onclick="switchSatelliteBand('ir')" class="flex-1 py-1 rounded text-center font-medium bg-sky-500 text-slate-950 transition">赤外 (夜間OK)</button>
          <button id="btn-sat-color" onclick="switchSatelliteBand('color')" class="flex-1 py-1 rounded text-center font-medium text-slate-400 hover:text-slate-200 transition">トゥルーカラー</button>
        </div>
      </div>

      <!-- 下部トグルボタン -->
      <div class="flex items-center justify-between pt-1 text-xs">
        <button id="btn-rectify-toggle" onclick="toggleRectify()" class="py-1 px-2 rounded font-medium bg-slate-800 border border-slate-700 text-sky-400 hover:bg-slate-750 transition flex items-center gap-1">
          <i data-lucide="check-circle" class="w-3.5 h-3.5"></i>
          <span id="rectify-status-text">幾何補正: ON</span>
        </button>

        <button onclick="resetMapView()" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded border border-slate-700 transition">
          視点リセット
        </button>
      </div>

    </div>
  </main>

  <script>
    let map;
    let weatherOverlay = null;
    let himawariLayer = null;
    let currentArea = 'near';       // 'near' or 'asia'
    let currentChartMode = 'live';  // 'live' or 'expert'
    let currentSatBand = 'color';   // デフォルト: トゥルーカラー
    let isSatelliteVisible = true;
    let currentBlendMode = 'multiply';
    let currentOpacity = 0.85;
    let isRectifyEnabled = true;
    let cachedJmaData = null;
    let rawWeatherImg = null;

    // 表示境界 (Webメルカトル展開用)
    const MERCATOR_BOUNDS = {
      near: { latMin: 20.0, latMax: 50.0, lonMin: 118.0, lonMax: 154.0 },
      asia: { latMin: 5.0,  latMax: 60.0, lonMin: 85.0,  lonMax: 175.0 }
    };

    // 気象庁ポーラーステレオ投影パラメータ (phi0=60N, lam0=140E)
    // u0: 北極のX比率, v0: 北極のY比率(負値=画像上端より上), scale: 拡大倍率
    const PROJ_PARAMS = {
      near: { u0: 0.50, v0: -1.05, scale: 1.62 },
      asia: { u0: 0.52, v0: -0.75, scale: 1.15 }
    };

    const EXPERT_URLS = {
      AXFE578: "https://www.data.jma.go.jp/fcd/yoho/data/wxchart/expert/AXFE578.png",
      ASAS: "https://www.data.jma.go.jp/fcd/yoho/data/wxchart/expert/ASAS.png",
      FSAS24: "https://www.data.jma.go.jp/fcd/yoho/data/wxchart/expert/FSAS24.png",
      AUPN50: "https://www.data.jma.go.jp/fcd/yoho/data/wxchart/expert/AUPN50.png"
    };

    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      initMap();
      loadAllData();
      setupSlider();
    });

    function initMap() {
      map = L.map('map', {
        zoomControl: false,
        attributionControl: false,
        minZoom: 2,
        maxZoom: 8
      }).setView([36.0, 137.5], 5);

      // 海岸線ベースマップ（Esri Dark Gray：APIキー不要）
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 16
      }).addTo(map);

      L.control.zoom({ position: 'topleft' }).addTo(map);
    }

    async function loadAllData() {
      document.getElementById('chart-time').textContent = '更新中...';
      await Promise.all([updateSatelliteLayer(), fetchWeatherChartList()]);
      processWeatherChart();
    }

    // ひまわり衛星画像の更新
    async function updateSatelliteLayer() {
      const mode = currentArea === 'near' ? 'jp' : 'fd';
      const targetTimeUrl = `https://www.jma.go.jp/bosai/himawari/data/satimg/targetTimes_${mode}.json`;

      try {
        const res = await fetch(targetTimeUrl);
        const times = await res.json();
        if (times && times.length > 0) {
          const latest = times[times.length - 1];
          const basetime = latest.basetime;
          const validtime = latest.validtime;

          if (himawariLayer) {
            map.removeLayer(himawariLayer);
          }

          const bandPath = currentSatBand === 'ir' ? 'B13/TBB' : 'REP/ETC';

          himawariLayer = L.tileLayer(
            `https://www.jma.go.jp/bosai/himawari/data/satimg/${basetime}/${mode}/${validtime}/${bandPath}/{z}/{x}/{y}.jpg`,
            {
              opacity: 0.85,
              zIndex: 10,
              maxNativeZoom: mode === 'near' ? 6 : 5,
              maxZoom: 8
            }
          );

          if (isSatelliteVisible) {
            himawariLayer.addTo(map);
          }
        }
      } catch (err) {
        console.warn('衛星データ取得失敗:', err);
      }
    }

    async function switchSatelliteBand(band) {
      if (currentSatBand === band) return;
      currentSatBand = band;

      const btnIr = document.getElementById('btn-sat-ir');
      const btnColor = document.getElementById('btn-sat-color');

      if (band === 'ir') {
        btnIr.className = 'flex-1 py-1 rounded text-center font-medium bg-sky-500 text-slate-950 transition';
        btnColor.className = 'flex-1 py-1 rounded text-center font-medium text-slate-400 hover:text-slate-200 transition';
      } else {
        btnColor.className = 'flex-1 py-1 rounded text-center font-medium bg-sky-500 text-slate-950 transition';
        btnIr.className = 'flex-1 py-1 rounded text-center font-medium text-slate-400 hover:text-slate-200 transition';
      }

      await updateSatelliteLayer();
    }

    function toggleSatelliteVisibility() {
      isSatelliteVisible = !isSatelliteVisible;
      const btnEye = document.getElementById('btn-sat-eye');
      if (isSatelliteVisible) {
        btnEye.textContent = '表示中 (タップで非表示)';
        if (himawariLayer && !map.hasLayer(himawariLayer)) {
          map.addLayer(himawariLayer);
        }
      } else {
        btnEye.textContent = '非表示中 (タップで表示)';
        if (himawariLayer && map.hasLayer(himawariLayer)) {
          map.removeLayer(himawariLayer);
        }
      }
    }

    async function fetchWeatherChartList() {
      try {
        const jmaRes = await fetch('https://www.jma.go.jp/bosai/weather_map/data/list.json');
        cachedJmaData = await jmaRes.json();
      } catch (err) {
        console.error('天気図リスト取得失敗:', err);
      }
    }

    function processWeatherChart() {
      let imageUrl = '';

      if (currentChartMode === 'live') {
        if (!cachedJmaData) return;
        const areaGroup = cachedJmaData[currentArea];
        if (areaGroup && areaGroup.now && areaGroup.now.length > 0) {
          const fileName = areaGroup.now[areaGroup.now.length - 1];
          imageUrl = `https://www.jma.go.jp/bosai/weather_map/data/png/${fileName}`;
          
          try {
            const match = fileName.match(/(\d{4})(\d{2})(\d{2})(\d{2})\d{4}/);
            if (match) {
              const m = match[2];
              const d = match[3];
              const utcHour = parseInt(match[4], 10);
              const jstHour = (utcHour + 9) % 24;
              const reg = currentArea === 'near' ? '日本' : 'アジア';
              document.getElementById('chart-time').textContent = `${reg} ${m}/${d} ${String(jstHour).padStart(2, '0')}:00`;
            }
          } catch(e) {
            document.getElementById('chart-time').textContent = '最新実況';
          }
        }
      } else {
        const expertKey = document.getElementById('expert-chart-select').value;
        imageUrl = `${EXPERT_URLS[expertKey]}?_t=${Date.now()}`;
        document.getElementById('chart-time').textContent = `専門: ${expertKey}`;
      }

      if (!imageUrl) return;

      const img = new Image();
      img.crossOrigin = "anonymous";
      img.onload = () => {
        rawWeatherImg = img;
        renderLayer();
      };
      img.onerror = () => {
        fallbackRender(imageUrl);
      };
      img.src = imageUrl;
    }

    // 幾何補正エンジン（逆マッピング修正版）
    function renderLayer() {
      if (!rawWeatherImg) return;

      const boundsConfig = MERCATOR_BOUNDS[currentArea];
      const bounds = [
        [boundsConfig.latMin, boundsConfig.lonMin],
        [boundsConfig.latMax, boundsConfig.lonMax]
      ];

      if (!isRectifyEnabled) {
        fallbackRender(rawWeatherImg.src);
        return;
      }

      const canvas = document.createElement('canvas');
      const dstW = 960;
      const dstH = Math.round(dstW * ((boundsConfig.latMax - boundsConfig.latMin) / (boundsConfig.lonMax - boundsConfig.lonMin)) * 1.25);
      canvas.width = dstW;
      canvas.height = dstH;

      const ctx = canvas.getContext('2d');

      const srcCanvas = document.createElement('canvas');
      srcCanvas.width = rawWeatherImg.width;
      srcCanvas.height = rawWeatherImg.height;
      const srcCtx = srcCanvas.getContext('2d');
      srcCtx.drawImage(rawWeatherImg, 0, 0);

      let srcPixels, dstPixels, dstData;
      try {
        const srcData = srcCtx.getImageData(0, 0, srcCanvas.width, srcCanvas.height);
        srcPixels = new Uint32Array(srcData.data.buffer);
        dstData = ctx.createImageData(dstW, dstH);
        dstPixels = new Uint32Array(dstData.data.buffer);
      } catch (e) {
        fallbackRender(rawWeatherImg.src);
        return;
      }

      const srcW = srcCanvas.width;
      const srcH = srcCanvas.height;
      const params = PROJ_PARAMS[currentArea];

      const phi0 = 60 * Math.PI / 180;
      const lam0 = 140 * Math.PI / 180;

      const qMin = Math.log(Math.tan(Math.PI / 4 + (boundsConfig.latMin * Math.PI / 180) / 2));
      const qMax = Math.log(Math.tan(Math.PI / 4 + (boundsConfig.latMax * Math.PI / 180) / 2));

      for (let y = 0; y < dstH; y++) {
        const q = qMax - (y / dstH) * (qMax - qMin);
        const phi = 2 * Math.atan(Math.exp(q)) - Math.PI / 2;
        const r = ((1 + Math.sin(phi0)) / (1 + Math.sin(phi))) * Math.cos(phi);

        for (let x = 0; x < dstW; x++) {
          const lonDeg = boundsConfig.lonMin + (x / dstW) * (boundsConfig.lonMax - boundsConfig.lonMin);
          const lam = lonDeg * Math.PI / 180;
          const dLam = lam - lam0;

          // 極心平射図法: 南方向(+Y)へ正しく展開
          const xps = r * Math.sin(dLam);
          const yps = r * Math.cos(dLam);

          // 北極 (u0, v0) からの実画像ピクセル座標への射影
          const u = Math.round(srcW * params.u0 + srcW * params.scale * xps);
          const v = Math.round(srcH * params.v0 + srcH * params.scale * yps);

          if (u >= 0 && u < srcW && v >= 0 && v < srcH) {
            dstPixels[y * dstW + x] = srcPixels[v * srcW + u];
          } else {
            dstPixels[y * dstW + x] = 0; // 枠外は完全透明
          }
        }
      }

      ctx.putImageData(dstData, 0, 0);

      canvas.toBlob((blob) => {
        if (!blob) return;
        const rectUrl = URL.createObjectURL(blob);

        if (weatherOverlay) {
          map.removeLayer(weatherOverlay);
        }

        weatherOverlay = L.imageOverlay(rectUrl, bounds, {
          opacity: currentOpacity,
          zIndex: 20,
          className: currentBlendMode === 'multiply' ? 'blend-multiply' : 'blend-normal'
        }).addTo(map);
      });
    }

    function fallbackRender(url) {
      if (weatherOverlay) {
        map.removeLayer(weatherOverlay);
      }
      const boundsConfig = MERCATOR_BOUNDS[currentArea];
      const bounds = [
        [boundsConfig.latMin, boundsConfig.lonMin],
        [boundsConfig.latMax, boundsConfig.lonMax]
      ];
      weatherOverlay = L.imageOverlay(url, bounds, {
        opacity: currentOpacity,
        zIndex: 20,
        className: currentBlendMode === 'multiply' ? 'blend-multiply' : 'blend-normal'
      }).addTo(map);
    }

    function setChartTypeMode(mode) {
      if (currentChartMode === mode) return;
      currentChartMode = mode;

      const btnLive = document.getElementById('btn-mode-live');
      const btnExpert = document.getElementById('btn-mode-expert');
      const selectWrapper = document.getElementById('expert-select-container');

      if (mode === 'live') {
        btnLive.className = 'flex-1 py-1 rounded text-center text-xs font-medium bg-sky-500 text-slate-950 transition';
        btnExpert.className = 'flex-1 py-1 rounded text-center text-xs font-medium text-slate-400 hover:text-slate-200 transition';
        selectWrapper.classList.add('hidden');
      } else {
        btnExpert.className = 'flex-1 py-1 rounded text-center text-xs font-medium bg-sky-500 text-slate-950 transition';
        btnLive.className = 'flex-1 py-1 rounded text-center text-xs font-medium text-slate-400 hover:text-slate-200 transition';
        selectWrapper.classList.remove('hidden');
      }

      processWeatherChart();
    }

    function onExpertChartChange() {
      processWeatherChart();
    }

    async function switchArea(area) {
      if (currentArea === area) return;
      currentArea = area;

      const btnNear = document.getElementById('btn-area-near');
      const btnAsia = document.getElementById('btn-area-asia');

      if (area === 'near') {
        btnNear.className = 'flex-1 py-1 rounded text-center font-medium bg-sky-500 text-slate-950 transition';
        btnAsia.className = 'flex-1 py-1 rounded text-center font-medium text-slate-400 hover:text-slate-200 transition';
        map.flyTo([36.0, 137.5], 5, { duration: 0.8 });
      } else {
        btnAsia.className = 'flex-1 py-1 rounded text-center font-medium bg-sky-500 text-slate-950 transition';
        btnNear.className = 'flex-1 py-1 rounded text-center font-medium text-slate-400 hover:text-slate-200 transition';
        map.flyTo([32.0, 132.0], 3, { duration: 0.8 });
      }

      await updateSatelliteLayer();
      processWeatherChart();
    }

    function toggleRectify() {
      isRectifyEnabled = !isRectifyEnabled;
      document.getElementById('rectify-status-text').textContent = isRectifyEnabled ? '幾何補正: ON' : '幾何補正: OFF';
      renderLayer();
    }

    function setupSlider() {
      const slider = document.getElementById('opacity-slider');
      slider.addEventListener('input', (e) => {
        currentOpacity = e.target.value / 100;
        document.getElementById('opacity-val').textContent = `${e.target.value}%`;
        if (weatherOverlay) {
          weatherOverlay.setOpacity(currentOpacity);
        }
      });
    }

    function setBlendMode(mode) {
      currentBlendMode = mode;
      const btnMultiply = document.getElementById('btn-multiply');
      const btnNormal = document.getElementById('btn-normal');

      if (mode === 'multiply') {
        btnMultiply.className = 'flex-1 py-1 rounded text-center font-medium bg-sky-500 text-slate-950 transition';
        btnNormal.className = 'flex-1 py-1 rounded text-center font-medium text-slate-400 hover:text-slate-200 transition';
      } else {
        btnNormal.className = 'flex-1 py-1 rounded text-center font-medium bg-sky-500 text-slate-950 transition';
        btnMultiply.className = 'flex-1 py-1 rounded text-center font-medium text-slate-400 hover:text-slate-200 transition';
      }

      if (weatherOverlay) {
        const el = weatherOverlay.getElement();
        if (el) {
          el.className = mode === 'multiply' ? 'leaflet-image-layer blend-multiply' : 'leaflet-image-layer blend-normal';
        }
      }
    }

    function resetMapView() {
      if (currentArea === 'near') {
        map.setView([36.0, 137.5], 5);
      } else {
        map.setView([32.0, 132.0], 3);
      }
    }
  </script>
</body>
</html>
