<!DOCTYPE html>
<html lang="ja" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>専門地上天気図 × 気象衛星オーバーレイビューア</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+JP:wght@400;500;700&display=swap');
    body {
      font-family: 'Noto Sans JP', sans-serif;
      touch-action: manipulation;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    #map {
      height: 100%;
      width: 100%;
      background-color: #030712;
    }
    /* 乗算ブレンド：白地を完全透過して線と文字だけを浮かび上がらせる */
    .blend-multiply {
      mix-blend-mode: multiply !important;
      filter: contrast(130%) brightness(95%);
    }
    .blend-normal {
      mix-blend-mode: normal !important;
    }
    /* スライダーのスタイリング */
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 18px;
      width: 18px;
      border-radius: 50%;
      background: #38bdf8;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
    }
  </style>
</head>
<body class="h-full w-full overflow-hidden flex flex-col select-none">

  <!-- ヘッダー -->
  <header class="h-12 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 flex items-center justify-between px-3 z-20 shrink-0">
    <div class="flex items-center space-x-2">
      <i data-lucide="layers" class="w-5 h-5 text-sky-400"></i>
      <h1 class="text-sm font-bold tracking-wider text-slate-100 flex items-center gap-1.5">
        地上天気図 <span class="text-sky-400 text-xs font-normal">× 衛星オーバーレイ</span>
      </h1>
    </div>
    
    <div class="flex items-center space-x-2 text-xs">
      <span id="chart-time" class="font-mono text-slate-400 bg-slate-800/80 px-2 py-0.5 rounded border border-slate-700/60">
        実況取得中...
      </span>
      <button onclick="loadLatestData()" class="p-1.5 bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-300 rounded transition border border-slate-700" title="最新データ再取得">
        <i data-lucide="rotate-cw" class="w-4 h-4"></i>
      </button>
    </div>
  </header>

  <!-- 地図領域 -->
  <main class="relative flex-1 w-full h-full overflow-hidden">
    <div id="map"></div>

    <!-- コントロールパネル（スマホ下部フローティング配置） -->
    <div class="absolute bottom-4 left-3 right-3 sm:left-auto sm:right-4 sm:w-80 bg-slate-900/95 backdrop-blur-md border border-slate-700/80 rounded-xl p-3 z-[1000] shadow-2xl flex flex-col gap-3">
      
      <!-- レイヤー透過度調整スライダー -->
      <div>
        <div class="flex justify-between items-center text-xs font-semibold mb-1">
          <span class="text-slate-300 flex items-center gap-1">
            <i data-lucide="sliders" class="w-3.5 h-3.5 text-sky-400"></i>
            天気図の不透明度
          </span>
          <span id="opacity-val" class="font-mono text-sky-400">80%</span>
        </div>
        <input id="opacity-slider" type="range" min="0" max="100" value="80" 
               class="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-sky-400">
        <div class="flex justify-between text-[10px] text-slate-500 mt-1 font-mono">
          <span>0% (衛星のみ)</span>
          <span>50% (半透明)</span>
          <span>100% (天気図のみ)</span>
        </div>
      </div>

      <div class="h-px bg-slate-800"></div>

      <!-- 透過モード ＆ 領域切り替え -->
      <div class="grid grid-cols-2 gap-2 text-xs">
        <div>
          <label class="text-[11px] text-slate-400 block mb-1">合成方式</label>
          <div class="flex bg-slate-800 rounded-lg p-0.5 border border-slate-700">
            <button id="btn-multiply" onclick="setBlendMode('multiply')" class="flex-1 py-1 rounded text-center font-medium bg-sky-500 text-slate-950 transition">乗算(白透過)</button>
            <button id="btn-normal" onclick="setBlendMode('normal')" class="flex-1 py-1 rounded text-center font-medium text-slate-400 hover:text-slate-200 transition">通常</button>
          </div>
        </div>

        <div>
          <label class="text-[11px] text-slate-400 block mb-1">衛星雲レイヤー</label>
          <button id="btn-sat-toggle" onclick="toggleSatellite()" class="w-full py-1 px-2 rounded-lg font-medium bg-slate-800 border border-slate-700 text-sky-400 hover:bg-slate-750 transition flex items-center justify-center gap-1">
            <i data-lucide="cloud" class="w-3.5 h-3.5"></i>
            <span id="sat-status-text">赤外 (表示中)</span>
          </button>
        </div>
      </div>

      <!-- 天気図範囲プリセット -->
      <div class="flex items-center justify-between pt-1">
        <span class="text-[11px] text-slate-400">視点リセット:</span>
        <div class="flex gap-1.5">
          <button onclick="resetView('japan')" class="px-2 py-0.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs rounded border border-slate-700 transition">日本周辺</button>
          <button onclick="resetView('asia')" class="px-2 py-0.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs rounded border border-slate-700 transition">アジア太平洋</button>
        </div>
      </div>

    </div>
  </main>

  <script>
    // グローバル変数
    let map;
    let weatherChartOverlay = null;
    let satelliteLayer = null;
    let currentBlendMode = 'multiply';
    let currentOpacity = 0.8;
    let isSatelliteVisible = true;

    // アジア太平洋域／日本周辺のバウンディングボックス（緯度経度）
    // 気象庁地上実況図の投影範囲に合わせたキャリブレーション値
    const CHART_BOUNDS = [
      [18.0, 105.0], // 南西端 (北緯18度, 東経105度)
      [56.0, 160.0]  // 北東端 (北緯56度, 東経160度)
    ];

    // 初期化
    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      initMap();
      loadLatestData();
      setupEvents();
    });

    function initMap() {
      // 地図作成（ダーク調ベースマップ）
      map = L.map('map', {
        zoomControl: false,
        attributionControl: false,
        minZoom: 3,
        maxZoom: 8
      }).setView([36.0, 137.0], 5);

      // 海岸線・国境ベースタイル（CARTO Dark Matter）
      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        subdomains: 'abcd',
        maxZoom: 19
      }).addTo(map);

      // ズームコントロール（左上）
      L.control.zoom({ position: 'topleft' }).addTo(map);
    }

    // 最新データ（衛星 ＋ 気象庁地上天気図）の取得
    async function loadLatestData() {
      document.getElementById('chart-time').textContent = '更新中...';

      // 1. リアルタイム気象衛星（赤外雲画像）レイヤーの読み込み
      try {
        const satRes = await fetch('https://api.rainviewer.com/public/weather-maps.json');
        const satData = await satRes.json();
        if (satData && satData.satellite && satData.satellite.infrared) {
          const satFrames = satData.satellite.infrared;
          const latestFrame = satFrames[satFrames.length - 1];

          if (satelliteLayer) {
            map.removeLayer(satelliteLayer);
          }

          satelliteLayer = L.tileLayer(
            `https://tilecache.rainviewer.com/v2/satellite/${latestFrame.path}/256/{z}/{x}/{y}/0/0_0.png`,
            { opacity: 0.85, zIndex: 10 }
          );

          if (isSatelliteVisible) {
            satelliteLayer.addTo(map);
          }
        }
      } catch (e) {
        console.warn('衛星タイルの取得にフォールバックを使用します:', e);
      }

      // 2. 気象庁 地上実況天気図画像の取得
      try {
        const jmaRes = await fetch('https://www.jma.go.jp/bosai/weather_map/data/list.json');
        const jmaData = await jmaRes.json();

        // 最新の日本周辺実況天気図 (near) またはアジア太平洋実況天気図
        let chartUrl = '';
        let chartDateStr = '';

        if (jmaData && jmaData.near && jmaData.near.length > 0) {
          const latestCode = jmaData.near[jmaData.near.length - 1];
          chartUrl = `https://www.jma.go.jp/bosai/weather_map/data/png/${latestCode}.png`;
          
          // 日時文字列の整形 (例: 202609230600 -> 09/23 15:00 JST)
          const year = latestCode.substring(0, 4);
          const month = latestCode.substring(4, 6);
          const day = latestCode.substring(6, 8);
          const hourUTC = parseInt(latestCode.substring(8, 10), 10);
          const hourJST = (hourUTC + 9) % 24;
          chartDateStr = `${month}/${day} ${String(hourJST).padStart(2, '0')}:00 JST実況`;
        } else {
          // フォールバック用URL
          chartUrl = 'https://www.jma.go.jp/bosai/weather_map/data/png/latest.png';
          chartDateStr = '最新実況';
        }

        document.getElementById('chart-time').textContent = chartDateStr;
        updateChartOverlay(chartUrl);

      } catch (e) {
        console.error('天気図画像の取得に失敗しました:', e);
        document.getElementById('chart-time').textContent = '取得待機中';
      }
    }

    // 天気図オーバーレイの更新・配置
    function updateChartOverlay(imageUrl) {
      if (weatherChartOverlay) {
        map.removeLayer(weatherChartOverlay);
      }

      weatherChartOverlay = L.imageOverlay(imageUrl, CHART_BOUNDS, {
        opacity: currentOpacity,
        zIndex: 20,
        className: currentBlendMode === 'multiply' ? 'blend-multiply' : 'blend-normal'
      }).addTo(map);
    }

    // イベント設定
    function setupEvents() {
      // 透過度スライダー
      const slider = document.getElementById('opacity-slider');
      slider.addEventListener('input', (e) => {
        currentOpacity = e.target.value / 100;
        document.getElementById('opacity-val').textContent = `${e.target.value}%`;
        if (weatherChartOverlay) {
          weatherChartOverlay.setOpacity(currentOpacity);
        }
      });
    }

    // 乗算ブレンド／通常ブレンドの切り替え
    function setBlendMode(mode) {
      currentBlendMode = mode;
      const btnMultiply = document.getElementById('btn-multiply');
      const btnNormal = document.getElementById('btn-normal');

      if (mode === 'multiply') {
        btnMultiply.className = 'flex-1 py-1 rounded text-center font-medium bg-sky-500 text-slate-950 transition';
        btnNormal.className = 'flex-1 py-1 rounded text-center font-medium text-slate-400 hover:text-slate-200 transition';
      } else {
        btnNormal.className = 'flex-1 py-1 rounded text-center font-medium bg-sky-500 text-slate-950 transition';
        btnMultiply.className = 'flex-1 py-1 rounded text-center font-medium text-slate-400 hover:text-slate-200 transition';
      }

      if (weatherChartOverlay) {
        const el = weatherChartOverlay.getElement();
        if (el) {
          el.className = mode === 'multiply' ? 'leaflet-image-layer blend-multiply' : 'leaflet-image-layer blend-normal';
        }
      }
    }

    // 衛星雲画像のON/OFF
    function toggleSatellite() {
      isSatelliteVisible = !isSatelliteVisible;
      const textEl = document.getElementById('sat-status-text');
      
      if (isSatelliteVisible) {
        textEl.textContent = '赤外 (表示中)';
        if (satelliteLayer && !map.hasLayer(satelliteLayer)) {
          map.addLayer(satelliteLayer);
        }
      } else {
        textEl.textContent = '赤外 (非表示)';
        if (satelliteLayer && map.hasLayer(satelliteLayer)) {
          map.removeLayer(satelliteLayer);
        }
      }
    }

    // 視点リセット
    function resetView(region) {
      if (region === 'japan') {
        map.setView([36.0, 137.0], 5);
      } else if (region === 'asia') {
        map.setView([35.0, 135.0], 4);
      }
    }
  </script>
</body>
</html>

          chartDateStr = `${month}/${day} ${String(hourJST).padStart(2, '0')}:00 JST実況`;
        } else {
          // フォールバック用URL
          chartUrl = 'https://www.jma.go.jp/bosai/weather_map/data/png/latest.png';
          chartDateStr = '最新実況';
        }

        document.getElementById('chart-time').textContent = chartDateStr;
        updateChartOverlay(chartUrl);

      } catch (e) {
        console.error('天気図画像の取得に失敗しました:', e);
        document.getElementById('chart-time').textContent = '取得待機中';
      }
    }

    // 天気図オーバーレイの更新・配置
    function updateChartOverlay(imageUrl) {
      if (weatherChartOverlay) {
        map.removeLayer(weatherChartOverlay);
      }

      weatherChartOverlay = L.imageOverlay(imageUrl, CHART_BOUNDS, {
        opacity: currentOpacity,
        zIndex: 20,
        className: currentBlendMode === 'multiply' ? 'blend-multiply' : 'blend-normal'
      }).addTo(map);
    }

    // イベント設定
    function setupEvents() {
      // 透過度スライダー
      const slider = document.getElementById('opacity-slider');
      slider.addEventListener('input', (e) => {
        currentOpacity = e.target.value / 100;
        document.getElementById('opacity-val').textContent = `${e.target.value}%`;
        if (weatherChartOverlay) {
          weatherChartOverlay.setOpacity(currentOpacity);
        }
      });
    }

    // 乗算ブレンド／通常ブレンドの切り替え
    function setBlendMode(mode) {
      currentBlendMode = mode;
      const btnMultiply = document.getElementById('btn-multiply');
      const btnNormal = document.getElementById('btn-normal');

      if (mode === 'multiply') {
        btnMultiply.className = 'flex-1 py-1 rounded text-center font-medium bg-sky-500 text-slate-950 transition';
        btnNormal.className = 'flex-1 py-1 rounded text-center font-medium text-slate-400 hover:text-slate-200 transition';
      } else {
        btnNormal.className = 'flex-1 py-1 rounded text-center font-medium bg-sky-500 text-slate-950 transition';
        btnMultiply.className = 'flex-1 py-1 rounded text-center font-medium text-slate-400 hover:text-slate-200 transition';
      }

      if (weatherChartOverlay) {
        const el = weatherChartOverlay.getElement();
        if (el) {
          el.className = mode === 'multiply' ? 'leaflet-image-layer blend-multiply' : 'leaflet-image-layer blend-normal';
        }
      }
    }

    // 衛星雲画像のON/OFF
    function toggleSatellite() {
      isSatelliteVisible = !isSatelliteVisible;
      const textEl = document.getElementById('sat-status-text');
      
      if (isSatelliteVisible) {
        textEl.textContent = '赤外 (表示中)';
        if (satelliteLayer && !map.hasLayer(satelliteLayer)) {
          map.addLayer(satelliteLayer);
        }
      } else {
        textEl.textContent = '赤外 (非表示)';
        if (satelliteLayer && map.hasLayer(satelliteLayer)) {
          map.removeLayer(satelliteLayer);
        }
      }
    }

    // 視点リセット
    function resetView(region) {
      if (region === 'japan') {
        map.setView([36.0, 137.0], 5);
      } else if (region === 'asia') {
        map.setView([35.0, 135.0], 4);
      }
    }
  </script>
</body>
</html>
